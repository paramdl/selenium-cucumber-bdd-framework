name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * 1-5' # weekdays: catches changes on the public demo site
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test -Dheadless=true
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: test-output
          path: test-output/
          retention-days: 14
